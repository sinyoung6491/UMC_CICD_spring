# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  CI-CD:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # application.yml 생성 (dev용, 브랜치 조건 필요 없으면 if 제거해도 됨)
    - name: make application.yml
      run: |
        cd ./src/main/resources
        touch ./application.yml
        echo "${{ secrets.YML_DEV }}" > ./application.yml
      shell: bash

    # ✅ 테스트 제외하고 빌드
    - name: Build with Gradle Wrapper
      run: ./gradlew clean build -x test

    - name: Grant Execute Permission For Gradlew
      run: chmod +x gradlew

    ## docker build & push
    - name: docker build
      run: |
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        docker build -t ${{ secrets.DOCKER_USERNAME }}/imagename .
        docker push ${{ secrets.DOCKER_USERNAME }}/imagename:latest

    ## docker deploy
    - name: Deploy to dev
      uses: appleboy/ssh-action@master
      id: deploy-dev
      # develop 브랜치에서만 배포하고 싶으면 이 if 유지하고,
      # main 에서도 배포하고 싶으면 이 줄을 지우면 됨
      if: contains(github.ref, 'develop')
      with:
        key: ${{ secrets.PRIVATE_KEY }}
        host: ${{ secrets.HOST_DEV }}
        username: ${{ secrets.USERNAME }}
        port: 22
        script: |
          docker rm -f $(docker ps -qa) || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/imagename
          docker-compose up -d
          docker image prune -f

